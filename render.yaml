services:
  - type: web
    name: behu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: behu-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: behu
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_KYC_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: behu-postgres
    plan: free
    databaseName: behu
    user: behu
